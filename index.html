<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="My Keep — a simple personal notes app">
<title>My Keep</title>
<style>
:root{
 --bg:#f8f9fa;--surface:#fff;--surface2:#f1f3f4;--text:#202124;--muted:#6b7280;
 --border:#e1e4e8;--accent:#fbbc04;--danger:#d93025;--shadow:0 2px 10px rgba(0,0,0,.08);
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(66,133,244,.28);outline-offset:2px}
.app{min-height:100dvh;padding-bottom:74px}
.header{position:sticky;top:0;z-index:20;height:64px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:8px max(12px,env(safe-area-inset-left))}
.brand{font-weight:750;font-size:20px;white-space:nowrap}.brand b{color:var(--accent)}
.search{height:44px;flex:1;max-width:720px;margin:auto;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--surface2);border-radius:12px}
.search input{border:0;outline:0;background:transparent;width:100%;min-width:0;color:var(--text)}
.icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.icon:hover{background:var(--surface2)}
.main{width:min(1120px,100%);margin:auto;padding:18px 14px 28px}
.composer{width:min(620px,100%);margin:0 auto 22px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.composer input,.composer textarea{width:100%;border:0;outline:0;background:transparent;color:var(--text);padding:14px 16px}
.composer textarea{resize:none;min-height:80px;line-height:1.45}
.composer .compose-actions{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 10px;border-top:1px solid var(--border)}
.btn{min-height:42px;padding:9px 15px;border-radius:10px}.btn.primary{background:#202124;color:white}.btn.ghost:hover{background:var(--surface2)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
.section-head h2{font-size:17px;margin:0}.muted{color:var(--muted);font-size:13px}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.note{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px;min-height:155px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;overflow:hidden}
.note.pinned{border-top:4px solid var(--accent);padding-top:11px}
.note-head{display:flex;align-items:flex-start;gap:6px}.note-title{font-size:17px;font-weight:650;margin:0;flex:1;overflow-wrap:anywhere}
.note-body{white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere;max-height:230px;overflow:hidden}
.note-footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
.note-actions{display:flex}.tag{font-size:11px;background:var(--surface2);padding:4px 7px;border-radius:999px;color:var(--muted)}
.empty{text-align:center;padding:58px 15px;color:var(--muted)}.empty .emoji{font-size:42px;margin-bottom:8px}.empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:5px}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;width:58px;height:58px;border-radius:18px;background:#202124;color:#fff;font-size:28px;box-shadow:0 7px 20px rgba(0,0,0,.22)}
.bottom-nav{position:fixed;z-index:24;bottom:0;left:0;right:0;height:64px;padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:center}
.nav-inner{width:min(560px,100%);display:flex;justify-content:space-around}.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:20px;color:var(--muted)}.nav-btn span{font-size:10px}.nav-btn.active{color:var(--text);font-weight:650}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;display:none;align-items:flex-end}.backdrop.show{display:flex}
.editor{background:var(--surface);width:100%;max-height:94dvh;border-radius:20px 20px 0 0;padding:10px 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.editor-top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:7px}
.editor input{border:0;outline:0;background:transparent;color:var(--text);font-size:21px;font-weight:650;padding:15px 0}
.editor textarea{border:0;outline:0;background:transparent;color:var(--text);resize:none;min-height:40dvh;padding:8px 0;font-size:17px;line-height:1.55}
.editor-bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:8px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#202124;color:white;padding:10px 15px;border-radius:10px;z-index:60;display:none;font-size:14px;white-space:nowrap}
.hidden{display:none!important}
.dark{--bg:#18191b;--surface:#242528;--surface2:#303136;--text:#f1f3f4;--muted:#b8bbc0;--border:#414349}
@media(min-width:700px){
 .app{padding-bottom:20px}.bottom-nav{display:none}.fab{bottom:24px}.main{padding-top:24px}.backdrop{align-items:center;justify-content:center}.editor{width:min(680px,calc(100% - 28px));border-radius:18px;max-height:85dvh}.editor textarea{min-height:330px}
}
@media(max-width:600px){
 .header{height:58px}.brand{display:none}.main{padding:12px 10px 20px}.notes{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.note{min-height:145px;padding:12px;border-radius:11px}.note.pinned{padding-top:9px}.note-title{font-size:15px}.note-body{font-size:14px}.note .icon{width:36px;height:36px;font-size:17px}.composer{margin-bottom:17px}.search{height:42px}
}
@media(max-width:380px){.notes{grid-template-columns:1fr}.fab{right:14px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="brand">📝 My <b>Keep</b></div>
  <label class="search" aria-label="Search notes">🔍<input id="search" type="search" autocomplete="off" placeholder="Search notes"></label>
  <button class="icon" id="theme" aria-label="Toggle dark mode">🌙</button>
</header>

<main class="main">
<section class="composer">
  <input id="quickTitle" placeholder="Take a note..." aria-label="Note title">
  <div id="quickExpanded" class="hidden">
    <textarea id="quickBody" placeholder="Write something..." aria-label="Note content"></textarea>
    <div class="compose-actions">
      <span class="muted">Saved automatically</span>
      <div><button class="btn ghost" id="quickCancel">Cancel</button><button class="btn primary" id="quickSave">Save</button></div>
    </div>
  </div>
</section>

<div class="section-head">
  <h2 id="sectionTitle">All notes</h2><span class="muted" id="count"></span>
</div>
<section id="notes" class="notes"></section>
<div id="empty" class="empty"><div class="emoji">📝</div><strong>No notes yet</strong><span>Tap the box above or the + button to create one.</span></div>
</main>
</div>

<button class="fab" id="fab" aria-label="Create note">＋</button>

<nav class="bottom-nav">
 <div class="nav-inner">
  <button class="nav-btn active" id="allNav">📝<span>Notes</span></button>
  <button class="nav-btn" id="pinnedNav">📌<span>Pinned</span></button>
  <button class="nav-btn" id="trashNav">🗑️<span>Trash</span></button>
 </div>
</nav>

<div class="backdrop" id="backdrop">
 <section class="editor" role="dialog" aria-modal="true" aria-label="Edit note">
  <div class="editor-top"><span class="muted" id="editorStatus">Edit note</span><button class="icon" id="closeEditor" aria-label="Close">✕</button></div>
  <input id="editTitle" placeholder="Title">
  <textarea id="editBody" placeholder="Take a note..."></textarea>
  <div class="editor-bottom">
   <button class="btn ghost" id="editorPin">📌 Pin</button>
   <div><button class="btn danger" id="editorDelete">Delete</button><button class="btn primary" id="editorSave">Save</button></div>
  </div>
 </section>
</div>
<div class="toast" id="toast"></div>

<script>
const NOTES_KEY="mykeep_notes_v2", THEME_KEY="mykeep_theme_v2";
let notes=JSON.parse(localStorage.getItem(NOTES_KEY)||"[]");
let mode="all", editingId=null;

const $=id=>document.getElementById(id);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function persist(){localStorage.setItem(NOTES_KEY,JSON.stringify(notes));render()}
function showToast(t){$("toast").textContent=t;$("toast").style.display="block";clearTimeout(showToast.t);showToast.t=setTimeout(()=>$("toast").style.display="none",1600)}
function formatDate(t){return new Intl.DateTimeFormat(undefined,{month:"short",day:"numeric"}).format(t)}
function visibleNotes(){
 const q=$("search").value.trim().toLowerCase();
 return notes.filter(n=>mode==="trash"?n.deleted:!n.deleted && (mode==="pinned"?n.pinned:true))
 .filter(n=>(n.title+" "+n.body).toLowerCase().includes(q))
 .sort((a,b)=>mode==="trash"?b.updated-a.updated:Number(b.pinned)-Number(a.pinned)||b.updated-a.updated);
}
function render(){
 const list=visibleNotes();
 $("sectionTitle").textContent=mode==="trash"?"Trash":mode==="pinned"?"Pinned notes":"All notes";
 $("count").textContent=list.length+" "+(list.length===1?"note":"notes");
 $("notes").innerHTML=list.map(n=>`
 <article class="note ${n.pinned&&!n.deleted?"pinned":""}" data-id="${n.id}">
   <div class="note-head">
    <h3 class="note-title">${esc(n.title||"Untitled")}</h3>
    <div class="note-actions">
      ${!n.deleted?`<button class="icon pin" title="${n.pinned?"Unpin":"Pin"}">${n.pinned?"📌":"📍"}</button>`:""}
      <button class="icon edit" title="Open">${n.deleted?"👁️":"✏️"}</button>
    </div>
   </div>
   ${n.body?`<div class="note-body">${esc(n.body)}</div>`:""}
   <div class="note-footer"><span class="tag">${n.deleted?"Deleted":formatDate(n.updated)}</span>
     <div>${n.deleted?`<button class="btn ghost restore">Restore</button><button class="btn ghost deleteForever">Delete</button>`:`<button class="icon del" title="Move to trash">🗑️</button>`}</div>
   </div>
 </article>`).join("");
 $("empty").classList.toggle("hidden",list.length!==0);
}
function resetQuick(){$("quickTitle").value="";$("quickBody").value="";$("quickExpanded").classList.add("hidden")}
function createQuick(){
 const title=$("quickTitle").value.trim(),body=$("quickBody").value.trim();
 if(!title&&!body){$("quickExpanded").classList.remove("hidden");$("quickBody").focus();return}
 notes.unshift({id:uid(),title,body,pinned:false,deleted:false,updated:Date.now()});persist();resetQuick();showToast("Note saved");
}
function openEditor(id){
 const n=notes.find(x=>x.id===id);if(!n)return;
 editingId=id;$("editTitle").value=n.title;$("editBody").value=n.body;
 $("editorPin").textContent=n.pinned?"📌 Unpin":"📌 Pin";
 $("editorDelete").textContent=n.deleted?"Delete forever":"Move to trash";
 $("editorStatus").textContent=n.deleted?"Trash":"Edit note";
 $("backdrop").classList.add("show");setTimeout(()=>$("editTitle").focus(),50);
}
function closeEditor(){$("backdrop").classList.remove("show");editingId=null}
function setMode(m){
 mode=m;
 $("allNav").classList.toggle("active",m==="all");$("pinnedNav").classList.toggle("active",m==="pinned");$("trashNav").classList.toggle("active",m==="trash");
 render();window.scrollTo({top:0,behavior:"smooth"});
}
$("quickTitle").addEventListener("focus",()=>$("quickExpanded").classList.remove("hidden"));
$("quickTitle").addEventListener("keydown",e=>{if(e.key==="Enter"){$("quickExpanded").classList.remove("hidden");$("quickBody").focus()}});
$("quickSave").onclick=createQuick;$("quickCancel").onclick=resetQuick;$("fab").onclick=()=>{$("quickExpanded").classList.remove("hidden");$("quickTitle").focus()};
$("search").oninput=render;$("allNav").onclick=()=>setMode("all");$("pinnedNav").onclick=()=>setMode("pinned");$("trashNav").onclick=()=>setMode("trash");

$("notes").onclick=e=>{
 const card=e.target.closest(".note");if(!card)return;const n=notes.find(x=>x.id===card.dataset.id);if(!n)return;
 if(e.target.closest(".pin")){n.pinned=!n.pinned;n.updated=Date.now();persist();showToast(n.pinned?"Pinned":"Unpinned")}
 else if(e.target.closest(".del")){n.deleted=true;n.updated=Date.now();persist();showToast("Moved to trash")}
 else if(e.target.closest(".restore")){n.deleted=false;n.updated=Date.now();persist();showToast("Restored")}
 else if(e.target.closest(".deleteForever")){if(confirm("Delete this note permanently?")){notes=notes.filter(x=>x.id!==n.id);persist();showToast("Deleted permanently")}}
 else openEditor(n.id);
};
$("closeEditor").onclick=closeEditor;
$("backdrop").onclick=e=>{if(e.target===$("backdrop"))closeEditor()};
$("editorPin").onclick=()=>{const n=notes.find(x=>x.id===editingId);if(n){n.pinned=!n.pinned;$("editorPin").textContent=n.pinned?"📌 Unpin":"📌 Pin"}};
$("editorSave").onclick=()=>{
 const n=notes.find(x=>x.id===editingId);if(!n)return;
 n.title=$("editTitle").value.trim();n.body=$("editBody").value.trim();n.updated=Date.now();persist();closeEditor();showToast("Saved");
};
$("editorDelete").onclick=()=>{
 const n=notes.find(x=>x.id===editingId);if(!n)return;
 if(n.deleted){if(confirm("Delete this note permanently?")){notes=notes.filter(x=>x.id!==n.id);persist();closeEditor();showToast("Deleted permanently")}}
 else{n.deleted=true;n.updated=Date.now();persist();closeEditor();showToast("Moved to trash")}
};

function applyTheme(dark){
 document.documentElement.classList.toggle("dark",dark);$("theme").textContent=dark?"☀️":"🌙";localStorage.setItem(THEME_KEY,dark?"dark":"light");
}
$("theme").onclick=()=>applyTheme(localStorage.getItem(THEME_KEY)!=="dark");
applyTheme(localStorage.getItem(THEME_KEY)==="dark");
render();
</script>
</body>
</html>
